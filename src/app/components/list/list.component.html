<div class="toolbar">
  @if (title) {
  <h2>{{ title }}</h2>
  } @if (showToggle) {
  <div class="toggle">
    <ion-button [class.active]="isList" fill="clear" (click)="toggleLayout()">
      <ion-icon [name]="'list-outline'"></ion-icon>
    </ion-button>

    <ion-button [class.active]="!isList" fill="clear" (click)="toggleLayout()">
      <ion-icon [name]="'grid-outline'"></ion-icon>
    </ion-button>
  </div>
  }
</div>

@if (!isList) {
<div class="grid">
  @for (item of items; track $index) {
  <app-list-item [item]="item"></app-list-item>
  }
</div>
} @else {
<ion-list>
  @for (item of items; track $index) {
  <ion-item lines="none">
    <app-list-item [item]="item" [inList]="true"></app-list-item>
  </ion-item>
  }
</ion-list>

}
